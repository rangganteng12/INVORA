<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generator Link Undangan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f8edf1;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #c86f88;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 30px;
        }

        .link-item {
            padding: 12px;
            margin-top: 10px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            word-break: break-all;
        }

        .guest-name {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .link-url {
            font-size: 13px;
            color: #666;
        }

        .copy-btn {
            margin-top: 8px;
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Generator Link Undangan</h1>

    <label for="invitationId">
        ID Undangan
    </label>

    <input
        type="text"
        id="invitationId"
        placeholder="Contoh: ABC001"
    >


    <label for="guestList">
        Daftar Nama Tamu
    </label>

    <textarea
        id="guestList"
        placeholder="Satu nama per baris

Budi dan Keluarga
Andi & Sinta
Pak Dedi
Keluarga Pak Joko"
    ></textarea>


    <button id="generateButton">
        Buat Link Undangan
    </button>


    <div
    class="result"
    id="result"
></div>

<button
    id="copyAllButton"
    type="button"
    style="display:none;"
>
    Salin Semua Link
</button>

</div>


<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxKcjFZEKfJ4hyjeaj818jDtY2rCt1gH5kCYPlCugvLzMgkGNtv4QSucuaTYxL7FQezWA/exec";

const generateButton =
    document.getElementById("generateButton");

const copyAllButton =
    document.getElementById("copyAllButton");

let generatedLinks = [];


// =========================================
// VALIDASI ID UNDANGAN
// =========================================

function validateInvitationId(
    invitationId,
    callback
) {

    const callbackName =
        "validateInvitation_" + Date.now();

    const apiScript =
        document.createElement("script");


    window[callbackName] =
        function (response) {

            // Bersihkan
            delete window[callbackName];
            apiScript.remove();


            if (
                response &&
                response.success
            ) {

                callback(true);

            } else {

                callback(false);

            }

        };


    apiScript.src =
    API_URL +
    "?id=" +
    encodeURIComponent(invitationId) +
    "&mode=check" +
    "&callback=" +
    callbackName;


    document.head.appendChild(apiScript);

}


// =========================================
// GENERATE LINK
// =========================================

generateButton.addEventListener(
    "click",
    function () {

        const invitationId =
            document
                .getElementById("invitationId")
                .value
                .trim();

        const guestText =
            document
                .getElementById("guestList")
                .value
                .trim();

        const result =
            document.getElementById("result");


        // Cek ID
        if (!invitationId) {

            alert(
                "Masukkan ID Undangan."
            );

            return;

        }


        // Cek nama tamu
        if (!guestText) {

            alert(
                "Masukkan daftar nama tamu."
            );

            return;

        }


        // Loading
        generateButton.disabled = true;

        generateButton.textContent =
            "Memeriksa ID...";


        // =========================================
        // CEK ID KE GOOGLE SHEETS
        // =========================================

        validateInvitationId(
            invitationId,
            function (isValid) {

                generateButton.disabled = false;

                generateButton.textContent =
                    "Buat Link Undangan";


                // ID salah
                if (!isValid) {

    result.innerHTML = "";

    generatedLinks = [];

    copyAllButton.style.display = "none";

    alert(
        "ID Undangan tidak ditemukan."
    );

    return;

}


                // =========================================
                // ID BENAR → BUAT LINK
                // =========================================

                const guests =
                    guestText
                        .split("\n")
                        .map(function (name) {
                            return name.trim();
                        })
                        .filter(function (name) {
                            return name !== "";
                        });


                const baseURL =
                    window.location.origin +
                    window.location.pathname
                        .replace(
                            "generator.html",
                            "index.html"
                        );


                result.innerHTML =
                    "<h2>Hasil Link</h2>";


                generatedLinks = [];


                copyAllButton.style.display =
                    "block";


                guests.forEach(
                    function (guest) {

                        const link =
                            baseURL +
                            "?id=" +
                            encodeURIComponent(
                                invitationId
                            ) +
                            "&to=" +
                            encodeURIComponent(
                                guest
                            );


                        generatedLinks.push(
                            link
                        );


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "link-item";


                        item.innerHTML = `
    <div class="guest-name">
        ${guest}
    </div>

    <div class="link-url">
        ${link}
    </div>

    <button
        class="copy-btn"
        type="button"
    >
        Salin Link
    </button>

    <button
        class="copy-btn whatsapp-btn"
        type="button"
    >
        Kirim WhatsApp
    </button>
`;

const copyButton =
    item.querySelector(".copy-btn");

const whatsappButton =
    item.querySelector(".whatsapp-btn");


// =========================================
// TOMBOL SALIN LINK
// =========================================

copyButton.addEventListener(
    "click",
    function () {

        navigator.clipboard
            .writeText(link)
            .then(function () {

                copyButton.textContent =
                    "Berhasil disalin";

                setTimeout(
                    function () {

                        copyButton.textContent =
                            "Salin Link";

                    },
                    1500
                );

            });

    }
);


// =========================================
// TOMBOL KIRIM WHATSAPP
// =========================================

whatsappButton.addEventListener(
    "click",
    function () {

        const message =
            "Halo " +
            guest +
            ",\n\n" +
            "Berikut link undangan pernikahan kami:\n\n" +
            link +
            "\n\n" +
            "Mohon dibuka dan jangan lupa hadir di hari istimewa kami. Terima kasih. ♡";

        const whatsappURL =
            "https://wa.me/?text=" +
            encodeURIComponent(message);

        window.location.href =
            whatsappURL;

    }
);


result.appendChild(item);

                    }
                );

            }
        );

    }
);


// =========================================
// SALIN SEMUA LINK
// =========================================

copyAllButton.addEventListener(
    "click",
    function () {

        if (
            generatedLinks.length === 0
        ) {

            return;

        }


        navigator
            .clipboard
            .writeText(
                generatedLinks.join("\n")
            )
            .then(
                function () {

                    copyAllButton
                        .textContent =
                        "Semua Link Berhasil Disalin";


                    setTimeout(
                        function () {

                            copyAllButton
                                .textContent =
                                "Salin Semua Link";

                        },
                        2000
                    );

                }
            );

    }
);

</script>

</body>
</html>
